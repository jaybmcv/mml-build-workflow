<!-- Local CLI resolves /assets/beacon.glb. In MML Editor, upload GLB and use its asset URL. -->
<m-group>
  <m-light type="point" x="-3" y="7" z="6" intensity="160" cast-shadows="false"></m-light>
  <m-light type="point" x="4" y="5" z="-3" intensity="100" cast-shadows="false"></m-light>
  <m-cube width="6" depth="6" height="0.2" y="-0.1" color="#182a35"></m-cube>
  <m-model src="/assets/beacon.glb" collide="false">
    <m-attr-anim attr="ry" start="0" end="360" duration="14000"></m-attr-anim>
  </m-model>
  <m-label y="4.4" width="7" height="0.6" font-size="30" alignment="center" color="#182a35" font-color="#d6fffa" content="THREE.JS MODEL / MML ANIMATION"></m-label>
</m-group>
